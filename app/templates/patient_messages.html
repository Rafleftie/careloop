{% extends "patient_base.html" %}
{% block title %}{{ t.msgs_title }} · CareLoop{% endblock %}
{% block content %}
<div class="flex flex-col px-margin gap-space-md pt-space-md">
  <div>
    <h1 class="font-headline-lg text-headline-lg font-extrabold">{{ t.msgs_title }}</h1>
    <p class="font-body-sm text-on-surface-variant">{{ t.msgs_note }}</p>
  </div>
  {% for m in msgs %}
  <div class="flex flex-col {{ 'items-end' if m.dir == 'in' else 'items-start' }}">
    <div class="max-w-[85%] p-space-md rounded-2xl {{ 'bg-primary text-on-primary rounded-br-sm' if m.dir == 'in' else 'bg-surface-container-lowest shadow-sm rounded-bl-sm' }} font-body-sm leading-relaxed">{{ m.text }}</div>
    <span class="font-label-sm text-[11px] text-on-surface-variant mt-1">{{ m.when }}</span>
  </div>
  {% else %}
  <p class="text-on-surface-variant text-center py-10">{{ t.msgs_empty }}</p>
  {% endfor %}
</div>
{% endblock %}
